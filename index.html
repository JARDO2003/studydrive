<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratoire de test — COMEO AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12151b; --ink-soft:#1c212a; --ink-line:#2a313d; --ink-900:#0b0d11;
  --ledger:#eef3e9; --ledger-line:#c7d5bd; --ledger-line2:#b3c4a7;
  --gold:#c69a3e; --gold-soft:#e7c877; --rust:#a6462f;
  --text:#f3f1e9; --muted:#9aa290; --muted-dark:#5c6459;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink-900);color:var(--text);font-family:'IBM Plex Sans',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace}
.serif{font-family:'Fraunces',serif}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--ink-line);border-radius:4px}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
.btn{transition:transform .12s ease, box-shadow .12s ease, background .12s ease}
.btn:active{transform:translateY(1px)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.task-card{transition:background .12s ease, border-color .12s ease}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .9s linear infinite}
@media (prefers-reduced-motion: reduce){ .btn,.task-card,.spin{transition:none;animation:none} }

.header{background:linear-gradient(180deg, var(--ink) 0%, var(--ink-soft) 100%);border-bottom:1px solid var(--ink-line);padding:22px 28px}
.header-inner{max-width:1240px;margin:0 auto}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
.brand{display:flex;gap:16px;align-items:flex-start}
.brand-icon{width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg, var(--gold), var(--rust));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px rgba(198,154,62,0.25)}
.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:600;text-transform:uppercase}
.company-name{font-size:26px;font-weight:600;line-height:1.15;margin-top:3px}
.company-sub{font-size:13px;color:var(--muted);margin-top:2px}
.stamp{border:1.5px dashed var(--gold);border-radius:999px;padding:7px 16px;display:flex;align-items:center;gap:8px;transform:rotate(-3deg);color:var(--gold-soft);font-size:11px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;white-space:nowrap}
.fiche{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--ink-line);border:1px solid var(--ink-line);border-radius:10px;overflow:hidden}
.fiche-cell{background:var(--ink);padding:10px 14px}
.fiche-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-dark)}
.fiche-val{font-size:13px;margin-top:3px;font-weight:600}
.roles{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.role-chip{display:flex;align-items:center;gap:8px;background:var(--ink-soft);border:1px solid var(--ink-line);border-radius:999px;padding:6px 12px 6px 6px}
.role-chip.me{background:rgba(198,154,62,.1);border-color:var(--gold)}
.role-avatar{width:22px;height:22px;border-radius:50%;background:var(--ink-line);color:var(--text);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.role-chip.me .role-avatar{background:var(--gold);color:var(--ink-900)}
.role-label{font-size:9px;color:var(--muted-dark);text-transform:uppercase;letter-spacing:.08em}
.role-name{font-size:12px;font-weight:600}
.ghost-btn{background:transparent;border:1px solid var(--ink-line);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:12px}
.edit-box{margin-top:16px;background:var(--ink);border:1px solid var(--ink-line);border-radius:10px;padding:16px}
.edit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field label{display:flex;flex-direction:column;gap:4px}
.field span{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-dark)}
.field input{background:var(--ink);border:1px solid var(--ink-line);border-radius:6px;padding:7px 9px;color:var(--text);font-size:12.5px}

.main{max-width:1240px;margin:0 auto;padding:22px 28px 60px;display:grid;grid-template-columns:300px 1fr;gap:20px}
@media (max-width:820px){ .main{grid-template-columns:1fr} }
.panel{background:var(--ink-soft);border:1px solid var(--ink-line);border-radius:12px;padding:16px}
.panel-title{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.key-input-wrap{position:relative;margin-top:10px}
.key-input-wrap input{width:100%;background:var(--ink);border:1px solid var(--ink-line);border-radius:8px;padding:9px 34px 9px 10px;color:var(--text);font-size:12px}
.key-eye{position:absolute;right:8px;top:8px;background:none;border:none;color:var(--muted);padding:2px}
.key-hint{font-size:10.5px;color:var(--muted-dark);margin-top:8px;line-height:1.5}
.gen-btn{background:linear-gradient(135deg, var(--gold), var(--rust));border:none;border-radius:10px;padding:13px 16px;color:var(--ink-900);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(198,154,62,0.22);width:100%}
.gen-btn:disabled{opacity:.7;cursor:not-allowed}
.err-box{background:#3a1f18;border:1px solid var(--rust);border-radius:8px;padding:10px;font-size:12px;display:flex;gap:8px;color:#f0c9bd}
.stat-num{font-family:'Fraunces',serif;font-size:32px;font-weight:600}
.stat-row{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.inbox-list{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow-y:auto}
.inbox-empty{font-size:12px;color:var(--muted-dark);padding:8px;line-height:1.6}
.task-card{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 10px;display:flex;align-items:flex-start;gap:8px}
.task-card.active{background:rgba(198,154,62,.08);border-color:var(--gold)}
.task-card-title{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-card-sub{font-size:10.5px;color:var(--muted-dark);margin-top:1px}
.reset-btn{background:transparent;border:1px solid var(--ink-line);border-radius:8px;padding:9px 12px;color:var(--muted-dark);font-size:11.5px;display:flex;align-items:center;gap:6px;justify-content:center;width:100%}

.empty-state{height:100%;min-height:400px;border:1.5px dashed var(--ink-line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted-dark);text-align:center;padding:40px}

.task-panel{display:flex;flex-direction:column;gap:16px}
.memo{background:var(--ink-soft);border:1px solid var(--ink-line);border-radius:14px;padding:20px}
.memo-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.memo-eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.memo-title{font-size:21px;font-weight:600;margin-top:4px}
.badge{font-size:10.5px;padding:4px 9px;border-radius:999px;font-weight:700}
.memo-text{margin-top:14px;font-size:14.5px;line-height:1.75;color:#e7e4d8;font-style:italic}
.memo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--ink-line);border-radius:8px;overflow:hidden;margin-top:16px}
.memo-cell{background:var(--ink-soft);padding:8px 10px}
.memo-cell-label{font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-dark)}
.memo-cell-val{font-size:12px;margin-top:2px}
.memo-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.btn-primary{background:var(--gold);border:none;border-radius:8px;padding:10px 16px;color:var(--ink-900);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:7px}
.btn-ghost{background:transparent;border:1px solid var(--ink-line);border-radius:8px;padding:10px 16px;color:var(--muted);font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:7px}
.btn-danger{color:var(--rust)}
.eval-box{background:var(--ink-soft);border:1px solid var(--ink-line);border-radius:14px;padding:18px}
.eval-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:10px}
.eval-btns{display:flex;gap:10px}
.eval-btn.on-good{border-color:#8fbf7f;background:rgba(143,191,127,.13);color:#8fbf7f}
.eval-btn.on-bad{border-color:var(--rust);background:rgba(166,70,47,.13);color:#e08a72}
.eval-note{width:100%;margin-top:12px;background:var(--ink);border:1px solid var(--ink-line);border-radius:8px;padding:10px;color:var(--text);font-size:12.5px;min-height:70px;resize:vertical}

.ledger{background:var(--ledger);border-radius:14px;overflow:hidden;border:1px solid var(--ledger-line2)}
.ledger-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--ledger-line);border:none;color:var(--ink-900)}
.ledger-toggle-label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em}
.ledger-toggle-hint{font-size:11px;color:#4a5240}
.ledger-body{padding:6px 4px 14px}
table.ledger-table{width:100%;border-collapse:collapse;font-size:12.5px;color:#232a1c}
.ledger-table th{text-align:left;padding:8px 14px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#5c6a4c;border-bottom:1.5px solid var(--ledger-line2)}
.ledger-table th.num{text-align:right}
.ledger-table td{padding:8px 14px;border-bottom:1px solid var(--ledger-line)}
.ledger-table td.num{text-align:right}
.ledger-table tfoot td{border-top:1.5px solid var(--ledger-line2);border-bottom:none;font-weight:700}
.balance-note{font-size:10.5px;font-family:'IBM Plex Sans',sans-serif;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ────────────────────────────────────────────────────────────
   STOCKAGE (persistant dans Claude, mémoire simple sinon)
   ──────────────────────────────────────────────────────────── */
const memoryStore = {};
const storage = {
  async get(key) {
    if (window.storage) {
      try {
        const r = await window.storage.get(key, false);
        return r && r.value ? JSON.parse(r.value) : null;
      } catch (e) { return null; }
    }
    return memoryStore[key] || null;
  },
  async set(key, value) {
    if (window.storage) {
      try { await window.storage.set(key, JSON.stringify(value), false); } catch (e) {}
    }
    memoryStore[key] = value;
  },
};

/* ────────────────────────────────────────────────────────────
   DONNÉES
   ──────────────────────────────────────────────────────────── */
const DEFAULT_COMPANY = {
  nom: "COMPTOIR GENERAL DE COTE D'IVOIRE",
  sigle: "CGCI SARL",
  capital: 280000000,
  secteur: "Commerce général — achat/revente de marchandises",
  siege: "Zone Industrielle de Koumassi, Abidjan, Côte d'Ivoire",
  rccm: "CI-ABJ-2019-B-14032",
  regimeFiscal: "Régime du Réel Normal d'Imposition",
  tauxTva: 18,
  dg: "M. Bernard Yao Kouassi",
  secretaire: "Mme Chantal Aya Koffi",
  comptable: "Vous",
};
const MODEL = "gemini-flash-latest"; // alias toujours à jour vers le dernier modèle Flash GA

const state = {
  company: { ...DEFAULT_COMPANY },
  editingCompany: false,
  apiKey: "",
  showKey: false,
  tasks: [],
  activeId: null,
  loading: false,
  loadErr: "",
  ready: false,
  showCorrection: {},
};

/* ────────────────────────────────────────────────────────────
   UTILITAIRES
   ──────────────────────────────────────────────────────────── */
function fcfa(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return new Intl.NumberFormat("fr-FR").format(Math.round(n)) + " FCFA";
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function initials(name) { return String(name).split(" ").map((w) => w[0]).slice(0, 2).join(""); }
function stripFences(s) { return s.replace(/```json/gi, "").replace(/```/g, "").trim(); }

const TASK_SCHEMA = {
  type: "object",
  properties: {
    titre: { type: "string" },
    emetteur: { type: "string", enum: ["Directeur Général", "Secrétaire"] },
    message: { type: "string" },
    type_operation: { type: "string" },
    journal: { type: "string", enum: ["AC", "VE", "BQ", "CA", "OD"] },
    piece_reference: { type: "string" },
    date_operation: { type: "string" },
    tiers: { type: "string" },
    montant_ht: { type: "number" },
    taux_tva: { type: "number" },
    montant_tva: { type: "number" },
    montant_ttc: { type: "number" },
    difficulte: { type: "string", enum: ["Débutant", "Intermédiaire", "Avancé"] },
    ecriture_correcte: {
      type: "array",
      items: {
        type: "object",
        properties: {
          compte: { type: "string" },
          libelle: { type: "string" },
          debit: { type: "number" },
          credit: { type: "number" },
        },
        required: ["compte", "libelle", "debit", "credit"],
      },
    },
  },
  required: ["titre","emetteur","message","type_operation","journal","piece_reference","date_operation","tiers","montant_ht","taux_tva","montant_tva","montant_ttc","difficulte","ecriture_correcte"],
};

function buildPrompt(company, history) {
  const recents = history.slice(-6).map((t) => `- ${t.date_operation} · ${t.type_operation} · ${t.tiers} · ${fcfa(t.montant_ttc)}`).join("\n") || "Aucune tâche précédente.";
  return `Tu es le générateur de scénarios pour un laboratoire de test d'un logiciel de comptabilité SYSCOHADA (OHADA), utilisé pour vérifier la fiabilité du logiciel "COMEO AI".

ENTREPRISE FICTIVE (pour le test uniquement) :
- Nom : ${company.nom} (${company.sigle})
- Capital social : ${fcfa(company.capital)}
- Secteur : ${company.secteur}
- Siège : ${company.siege}
- Régime fiscal : ${company.regimeFiscal}
- Taux de TVA en vigueur : ${company.tauxTva}%
- Directeur Général : ${company.dg}
- Secrétaire : ${company.secretaire}
- Comptable (l'utilisateur qui va traiter la tâche) : ${company.comptable}

DERNIÈRES TÂCHES DÉJÀ ENVOYÉES (pour varier et garder une cohérence de dossier, ne pas répéter à l'identique) :
${recents}

CONSIGNE :
Génère UNE seule nouvelle tâche comptable réaliste pour un commerce général (achat/revente de marchandises) conforme au plan comptable SYSCOHADA révisé (OHADA 2023). Le type d'opération doit varier (achat marchandises, vente marchandises, règlement fournisseur, encaissement client, versement banque/caisse, paiement de salaire, charges sociales CNPS, achat de petit matériel, frais bancaires, remboursement d'emprunt, etc.). Le message doit être écrit comme une VRAIE note interne envoyée au comptable par le Directeur Général ou la Secrétaire (ton professionnel, naturel, avec le contexte de l'opération), sans révéler les comptes comptables à utiliser.

L'écriture comptable correcte attendue ("ecriture_correcte") doit :
- utiliser les bons numéros et intitulés de comptes SYSCOHADA révisé,
- être parfaitement équilibrée (somme des débits = somme des crédits),
- inclure la TVA quand elle s'applique (compte 4452 TVA récupérable pour les achats, 4432 TVA facturée pour les ventes),
- correspondre exactement aux montants ht/tva/ttc fournis.

Réponds UNIQUEMENT avec un objet JSON conforme au schéma fourni, sans texte autour, sans balises markdown.`;
}

/* ────────────────────────────────────────────────────────────
   ICÔNES (SVG minimalistes)
   ──────────────────────────────────────────────────────────── */
const ic = {
  building: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18"/><path d="M9 21v-4h6v4M9 8h.01M15 8h.01M9 12h.01M15 12h.01"/></svg>`,
  stamp: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 013 3v4h2l2 6H5l2-6h2V5a3 3 0 013-3z"/><path d="M5 22h14M7 17h10"/></svg>`,
  key: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.5 12.5L20 3M20 3v5M20 3h-5"/></svg>`,
  eye: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`,
  eyeOff: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.6 10.6 0 0112 19c-7 0-11-7-11-7a18.6 18.6 0 015.1-5.6M9.9 4.2A10.4 10.4 0 0112 4c7 0 11 7 11 7a18.7 18.7 0 01-2.2 3.1M14.1 14.1a3 3 0 10-4.2-4.2"/><path d="M1 1l22 22"/></svg>`,
  sparkles: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>`,
  loader: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>`,
  alert: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L1 21h22z"/><path d="M12 9v5M12 17h.01"/></svg>`,
  landmark: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22h18M4 22V11M20 22V11M2 11l10-6 10 6M6 11v6M12 11v6M18 11v6"/></svg>`,
  inbox: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.4 5h13.2L22 12v6a2 2 0 01-2 2H4a2 2 0 01-2-2v-6z"/></svg>`,
  check: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>`,
  circle: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>`,
  chevron: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`,
  reset: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.7 2.7L3 8"/><path d="M3 3v5h5"/></svg>`,
  scroll: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8a2 2 0 002-2V7l-5-5H8a2 2 0 00-2 2v15a2 2 0 002 2z"/><path d="M8 12h8M8 16h5"/></svg>`,
  trash: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>`,
  thumbUp: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11M2 10h4v11H2zM7 10l4-8 1.5 1L11 10h8a2 2 0 012 2.3l-1.6 8A2 2 0 0117.4 22H7"/></svg>`,
  thumbDown: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V3M22 14h-4V3h4zM17 14l-4 8-1.5-1 1.5-7H5a2 2 0 01-2-2.3l1.6-8A2 2 0 016.6 2H17"/></svg>`,
};

/* ────────────────────────────────────────────────────────────
   CHARGEMENT INITIAL
   ──────────────────────────────────────────────────────────── */
(async function init() {
  const c = await storage.get("lab-company");
  if (c) state.company = c;
  const t = await storage.get("lab-tasks");
  if (t) { state.tasks = t; if (t.length) state.activeId = t[t.length - 1].id; }
  state.ready = true;
  render();
})();

async function saveCompany(next) {
  state.company = next;
  await storage.set("lab-company", next);
}
async function saveTasks() { await storage.set("lab-tasks", state.tasks); }

/* ────────────────────────────────────────────────────────────
   ACTIONS
   ──────────────────────────────────────────────────────────── */
async function generateTask() {
  if (!state.apiKey.trim()) { state.loadErr = "Renseigne d'abord ta clé API Gemini ci-dessus."; render(); return; }
  state.loading = true; state.loadErr = ""; render();
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(state.apiKey.trim())}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ role: "user", parts: [{ text: buildPrompt(state.company, state.tasks) }] }],
        generationConfig: { temperature: 0.9, responseMimeType: "application/json", responseSchema: TASK_SCHEMA },
      }),
    });
    if (!res.ok) {
      const errText = await res.text();
      if (res.status === 429) {
        throw new Error("Quota Gemini atteint (429). Le niveau gratuit limite le nombre de requêtes par minute et par jour. Attends une minute avant de réessayer, ou vérifie ton quota sur https://ai.google.dev/gemini-api/docs/rate-limits.");
      }
      throw new Error(`Gemini a répondu ${res.status} : ${errText.slice(0, 200)}`);
    }
    const data = await res.json();
    const raw = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text;
    if (!raw) throw new Error("Réponse vide ou bloquée par Gemini.");
    const parsed = JSON.parse(stripFences(raw));
    const task = { id: uid(), createdAt: new Date().toISOString(), status: "a_faire", evaluation: null, note: "", ...parsed };
    state.tasks.push(task);
    state.activeId = task.id;
    state.showCorrection[task.id] = false;
    await saveTasks();
  } catch (e) {
    state.loadErr = e.message || "Erreur lors de la génération.";
  } finally {
    state.loading = false; render();
  }
}
function markStatus(id, status) { const t = state.tasks.find((x) => x.id === id); if (t) t.status = status; saveTasks(); render(); }
function markEvaluation(id, v) { const t = state.tasks.find((x) => x.id === id); if (t) t.evaluation = v; saveTasks(); render(); }
function setNote(id, v) { const t = state.tasks.find((x) => x.id === id); if (t) t.note = v; saveTasks(); }
function deleteTask(id) { state.tasks = state.tasks.filter((x) => x.id !== id); if (state.activeId === id) state.activeId = null; saveTasks(); render(); }
async function resetLab() {
  if (!confirm("Réinitialiser tout le laboratoire (entreprise + historique des tâches) ?")) return;
  state.tasks = []; state.activeId = null;
  await saveCompany({ ...DEFAULT_COMPANY });
  await saveTasks();
  render();
}
function setActive(id) { state.activeId = id; render(); }
function toggleCorrection(id) { state.showCorrection[id] = !state.showCorrection[id]; render(); }
function toggleEditCompany() { state.editingCompany = !state.editingCompany; render(); }
function toggleShowKey() { state.showKey = !state.showKey; render(); }
function onApiKeyInput(v) { state.apiKey = v; }

/* ────────────────────────────────────────────────────────────
   RENDU
   ──────────────────────────────────────────────────────────── */
function render() {
  const app = document.getElementById("app");
  const c = state.company;
  const active = state.tasks.find((t) => t.id === state.activeId) || null;
  const done = state.tasks.filter((t) => t.status === "traite");
  const conforme = done.filter((t) => t.evaluation === "conforme").length;
  const ecart = done.filter((t) => t.evaluation === "ecart").length;
  const fiabilite = done.length ? Math.round((conforme / done.length) * 100) : null;
  const fiabColor = fiabilite === null ? "var(--muted)" : fiabilite >= 80 ? "#8fbf7f" : fiabilite >= 50 ? "var(--gold)" : "var(--rust)";

  app.innerHTML = `
  <header class="header">
    <div class="header-inner">
      <div class="top-row">
        <div class="brand">
          <div class="brand-icon">${ic.building}</div>
          <div>
            <div class="eyebrow">Dossier d'entreprise — Laboratoire de test COMEO AI</div>
            <div class="company-name serif">${esc(c.nom)}</div>
            <div class="company-sub">${esc(c.sigle)} · ${esc(c.siege)}</div>
          </div>
        </div>
        <div class="stamp">${ic.stamp} Entreprise fictive · Simulation</div>
      </div>

      <div class="fiche">
        ${ficheCell("Capital social", fcfa(c.capital), "var(--gold)")}
        ${ficheCell("Secteur", esc(c.secteur))}
        ${ficheCell("RCCM", esc(c.rccm))}
        ${ficheCell("Régime fiscal", esc(c.regimeFiscal))}
        ${ficheCell("TVA", c.tauxTva + "%")}
      </div>

      <div class="roles">
        ${roleChip("Directeur Général", c.dg, false)}
        ${roleChip("Secrétaire", c.secretaire, false)}
        ${roleChip("Comptable", c.comptable, true)}
        <button class="ghost-btn btn" style="margin-left:auto" onclick="toggleEditCompany()">${state.editingCompany ? "Fermer l'édition" : "Modifier le dossier"}</button>
      </div>

      ${state.editingCompany ? companyEditor(c) : ""}
    </div>
  </header>

  <main class="main">
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div class="panel">
        <div class="panel-title">${ic.key} Clé API Gemini</div>
        <div class="key-input-wrap">
          <input id="apiKeyInput" type="${state.showKey ? "text" : "password"}" value="${esc(state.apiKey)}" placeholder="Colle ta clé ici (session uniquement)" oninput="onApiKeyInput(this.value)" class="mono">
          <button class="key-eye" onclick="toggleShowKey()" aria-label="Afficher/masquer la clé">${state.showKey ? ic.eyeOff : ic.eye}</button>
        </div>
        <p class="key-hint">Jamais enregistrée ni écrite dans le code — reste uniquement dans cette page tant qu'elle est ouverte.</p>
      </div>

      <button class="gen-btn btn" ${state.loading ? "disabled" : ""} onclick="generateTask()">
        ${state.loading ? `<span class="spin">${ic.loader}</span>` : ic.sparkles}
        ${state.loading ? "Génération en cours…" : "Nouvelle tâche du DG / Secrétaire"}
      </button>

      ${state.loadErr ? `<div class="err-box">${ic.alert}<span>${esc(state.loadErr)}</span></div>` : ""}

      <div class="panel">
        <div class="panel-title">${ic.landmark} Fiabilité mesurée</div>
        <div style="display:flex;align-items:baseline;gap:8px;margin-top:10px">
          <span class="stat-num" style="color:${fiabColor}">${fiabilite === null ? "—" : fiabilite + "%"}</span>
          <span style="font-size:11px;color:var(--muted-dark)">de tâches conformes</span>
        </div>
        <div class="stat-row">
          <span>${state.tasks.length} générées</span>
          <span>${done.length} traitées</span>
          <span style="color:#8fbf7f">${conforme} conformes</span>
          <span style="color:#e08a72">${ecart} écarts</span>
        </div>
      </div>

      <div class="panel" style="flex:1;min-height:200px">
        <div class="panel-title" style="padding:4px 6px 10px">${ic.inbox} Boîte de tâches (${state.tasks.length})</div>
        <div class="inbox-list">
          ${!state.ready ? `<div class="inbox-empty">Chargement…</div>` : ""}
          ${state.ready && state.tasks.length === 0 ? `<div class="inbox-empty">Aucune tâche pour l'instant. Clique sur « Nouvelle tâche » pour recevoir ta première note de service.</div>` : ""}
          ${[...state.tasks].reverse().map(taskCard).join("")}
        </div>
      </div>

      <button class="reset-btn btn" onclick="resetLab()">${ic.reset} Réinitialiser le laboratoire</button>
    </div>

    <div style="min-width:0">
      ${active ? taskPanel(active) : `<div class="empty-state">${ic.scroll}<div style="font-size:14px;max-width:340px;line-height:1.6">Sélectionne une tâche dans la boîte, ou génère-en une nouvelle pour recevoir ta prochaine note de service.</div></div>`}
    </div>
  </main>
  `;
}

function ficheCell(label, val, color) {
  return `<div class="fiche-cell"><div class="fiche-label">${esc(label)}</div><div class="fiche-val mono" style="${color ? `color:${color}` : ""}">${val}</div></div>`;
}
function roleChip(role, name, me) {
  return `<div class="role-chip${me ? " me" : ""}">
    <div class="role-avatar">${initials(name)}</div>
    <div><div class="role-label">${esc(role)}</div><div class="role-name">${esc(name)}</div></div>
  </div>`;
}
function companyEditor(c) {
  const fields = [
    ["nom", "Nom de l'entreprise", "text"], ["sigle", "Sigle", "text"], ["capital", "Capital social (FCFA)", "number"],
    ["secteur", "Secteur d'activité", "text"], ["siege", "Siège social", "text"], ["rccm", "RCCM", "text"],
    ["regimeFiscal", "Régime fiscal", "text"], ["tauxTva", "Taux TVA (%)", "number"], ["dg", "Directeur Général", "text"], ["secretaire", "Secrétaire", "text"],
  ];
  return `<div class="edit-box">
    <div class="edit-grid">
      ${fields.map(([key, label, type]) => `
        <div class="field"><label><span>${esc(label)}</span>
          <input data-field="${key}" type="${type}" value="${esc(c[key])}">
        </label></div>`).join("")}
    </div>
    <button class="btn-primary btn" style="margin-top:14px" onclick="saveCompanyFromForm()">Enregistrer le dossier</button>
  </div>`;
}
function saveCompanyFromForm() {
  const next = { ...state.company };
  document.querySelectorAll("[data-field]").forEach((el) => {
    const key = el.getAttribute("data-field");
    next[key] = el.type === "number" ? Number(el.value) : el.value;
  });
  saveCompany(next);
  state.editingCompany = false;
  render();
}

function taskCard(t) {
  const active = t.id === state.activeId;
  let statusIcon;
  if (t.status === "traite") {
    if (t.evaluation === "conforme") statusIcon = `<span style="color:#8fbf7f;margin-top:2px;flex-shrink:0">${ic.check}</span>`;
    else if (t.evaluation === "ecart") statusIcon = `<span style="color:#e08a72;margin-top:2px;flex-shrink:0">${ic.alert}</span>`;
    else statusIcon = `<span style="color:var(--muted);margin-top:2px;flex-shrink:0">${ic.check}</span>`;
  } else {
    statusIcon = `<span style="color:var(--muted-dark);margin-top:2px;flex-shrink:0">${ic.circle}</span>`;
  }
  return `<button class="task-card btn${active ? " active" : ""}" onclick="setActive('${t.id}')">
    ${statusIcon}
    <div style="min-width:0;flex:1">
      <div class="task-card-title">${esc(t.titre)}</div>
      <div class="task-card-sub">${esc(t.journal)} · ${esc(t.date_operation)} · ${fcfa(t.montant_ttc)}</div>
    </div>
    <span style="color:var(--muted-dark);flex-shrink:0;margin-top:3px">${ic.chevron}</span>
  </button>`;
}

function taskPanel(t) {
  const lines = t.ecriture_correcte || [];
  const totalDebit = lines.reduce((s, l) => s + (Number(l.debit) || 0), 0);
  const totalCredit = lines.reduce((s, l) => s + (Number(l.credit) || 0), 0);
  const balanced = Math.abs(totalDebit - totalCredit) < 1;
  const diffColor = { "Débutant": "#8fbf7f", "Intermédiaire": "var(--gold)", "Avancé": "var(--rust)" }[t.difficulte] || "var(--muted)";
  const showCorr = !!state.showCorrection[t.id];

  return `<div class="task-panel">
    <div class="memo">
      <div class="memo-top">
        <div>
          <div class="memo-eyebrow">Note interne — ${esc(t.emetteur)}</div>
          <div class="memo-title serif">${esc(t.titre)}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
          <span class="badge" style="background:${diffColor}22;color:${diffColor}">${esc(t.difficulte)}</span>
          <span class="badge mono" style="background:var(--ink);color:var(--muted)">Journal ${esc(t.journal)}</span>
        </div>
      </div>

      <p class="memo-text serif">« ${esc(t.message)} »</p>

      <div class="memo-grid">
        ${memoCell("Type d'opération", esc(t.type_operation))}
        ${memoCell("Tiers", esc(t.tiers))}
        ${memoCell("Pièce", esc(t.piece_reference))}
        ${memoCell("Date", esc(t.date_operation))}
        ${memoCell("Montant HT", fcfa(t.montant_ht))}
        ${memoCell(`TVA (${t.taux_tva}%)`, fcfa(t.montant_tva))}
        ${memoCell("Montant TTC", fcfa(t.montant_ttc))}
      </div>

      <div class="memo-actions">
        ${t.status === "a_faire"
          ? `<button class="btn-primary btn" onclick="markStatus('${t.id}','traite')">${ic.check} Marquer comme traité dans COMEO AI</button>`
          : `<button class="btn-ghost btn" onclick="markStatus('${t.id}','a_faire')">Réouvrir la tâche</button>`}
        <button class="btn-ghost btn-danger btn" style="margin-left:auto" onclick="deleteTask('${t.id}')">${ic.trash} Supprimer</button>
      </div>
    </div>

    ${t.status === "traite" ? `
    <div class="eval-box">
      <div class="eval-title">Résultat produit par COMEO AI — conforme à la correction ?</div>
      <div class="eval-btns">
        <button class="btn-ghost eval-btn btn${t.evaluation === "conforme" ? " on-good" : ""}" onclick="markEvaluation('${t.id}','conforme')">${ic.thumbUp} Conforme</button>
        <button class="btn-ghost eval-btn btn${t.evaluation === "ecart" ? " on-bad" : ""}" onclick="markEvaluation('${t.id}','ecart')">${ic.thumbDown} Écart détecté</button>
      </div>
      <textarea class="eval-note" placeholder="Note libre : ce que COMEO AI a proposé, l'écart observé, un compte erroné, une TVA mal calculée…" oninput="setNote('${t.id}', this.value)">${esc(t.note)}</textarea>
    </div>` : ""}

    <div class="ledger">
      <button class="ledger-toggle btn" onclick="toggleCorrection('${t.id}')">
        <span class="ledger-toggle-label">${showCorr ? ic.eye : ic.eyeOff} Écriture correcte attendue</span>
        <span class="ledger-toggle-hint">${showCorr ? "Masquer" : "Révéler la correction"}</span>
      </button>
      ${showCorr ? `
      <div class="ledger-body">
        <table class="ledger-table mono">
          <thead><tr><th>Compte</th><th>Libellé</th><th class="num">Débit</th><th class="num">Crédit</th></tr></thead>
          <tbody>
            ${lines.map((l) => `<tr>
              <td style="font-weight:600">${esc(l.compte)}</td>
              <td style="font-family:'IBM Plex Sans',sans-serif">${esc(l.libelle)}</td>
              <td class="num">${l.debit ? fcfa(l.debit) : ""}</td>
              <td class="num">${l.credit ? fcfa(l.credit) : ""}</td>
            </tr>`).join("")}
          </tbody>
          <tfoot>
            <tr>
              <td colspan="2" class="balance-note" style="color:${balanced ? "#4a7a3d" : "var(--rust)"}">${balanced ? "✓ Écriture équilibrée" : "⚠ Écriture déséquilibrée — vérifier le prompt/la réponse IA"}</td>
              <td class="num">${fcfa(totalDebit)}</td>
              <td class="num">${fcfa(totalCredit)}</td>
            </tr>
          </tfoot>
        </table>
      </div>` : ""}
    </div>
  </div>`;
}
function memoCell(label, val) {
  return `<div class="memo-cell"><div class="memo-cell-label">${label}</div><div class="memo-cell-val mono">${val}</div></div>`;
}
</script>
</body>
</html>
